services:
  r2-to-webdav:
    build: .
    container_name: r2-to-webdav
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - webdav-tmp:/tmp/r2-webdav
    # Large uploads need temporary disk space. Increase the volume limit/host disk as needed.
    stop_grace_period: 30s

volumes:
  webdav-tmp:
